<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncro - Acceso Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body.bg-syncro {
            background: linear-gradient(135deg, #090d16 0%, #151934 50%, #2b1035 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #fff !important;
            border-radius: 10px !important;
            padding: 12px;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.15) !important;
            border-color: #0dcaf0 !important;
            box-shadow: 0 0 10px rgba(13, 202, 240, 0.3) !important;
        }
        .btn-info-gradient {
            background: linear-gradient(135deg, #0dcaf0 0%, #0d6efd 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            color: white;
        }
    </style>
</head>
<body class="bg-syncro d-flex align-items-center justify-content-center p-3">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="glass-card p-4 p-md-5 text-white">
                    <div class="text-center mb-4">
                        <i class="bi bi-shop fs-1 text-info"></i>
                        <h2 class="fw-bold mt-2">Acceso de Clientes</h2>
                        <p class="text-white-50 fs-7">Ingresa la clave especial provista por tu microempresa favorita</p>
                    </div>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-danger bg-danger text-white border-0 py-2 mb-3 text-center fs-7 rounded-3">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form action="{{ url_for('acceso_cliente') }}" method="POST">
                        <div class="mb-4">
                            <label class="form-label text-white-50 fs-7">Clave de la Tienda (Ej. batimoon)</label>
                            <input type="text" class="form-control glass-input" name="clave_tienda" placeholder="Ingresa la clave aquí" required autocomplete="off">
                        </div>
                        <button type="submit" class="btn btn-info-gradient w-100 mb-3">Entrar a la Tienda</button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="{{ url_for('index') }}" class="text-decoration-none text-info"><i class="bi bi-arrow-left me-1"></i> Volver al inicio</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
