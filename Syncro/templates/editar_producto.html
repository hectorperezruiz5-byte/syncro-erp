<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncro - Editar Producto | {{ nombre_empresa }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body.tema-purpura { background: linear-gradient(135deg, #090d16 0%, #151934 50%, #2b1035 100%) !important; min-height: 100vh; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body.tema-azul { background: linear-gradient(135deg, #050b14 0%, #0f172a 50%, #1e3a8a 100%) !important; min-height: 100vh; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body.tema-esmeralda { background: linear-gradient(135deg, #022c22 0%, #064e3b 50%, #022c22 100%) !important; min-height: 100vh; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body.tema-cyberpunk { background: linear-gradient(135deg, #18181b 0%, #27272a 50%, #7f1d1d 100%) !important; min-height: 100vh; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .navbar-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #fff !important;
            border-radius: 10px !important;
            padding: 10px;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.15) !important;
            border-color: #a855f7 !important;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3) !important;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 600;
            color: white;
            width: 100%;
        }
    </style>
</head>
<body class="tema-{{ session.get('tema_activo', 'purpura') }} p-4">

    <div class="container py-3" style="max-width: 600px;">
        <!-- MENÚ DE NAVEGACIÓN SUPERIOR UNIFICADO -->
        <nav class="navbar navbar-expand-lg navbar-dark navbar-glass px-4 mb-4">
            <a class="navbar-brand fw-bold fs-5" href="{{ url_for('dashboard') }}" style="color: #c084fc;">
                <i class="bi bi-layers-fill me-2"></i>Syncro
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <a class="nav-link text-white-50" href="{{ url_for('inventario') }}"><i class="bi bi-arrow-left me-1"></i> Volver a Inventario</a>
            </div>
        </nav>

        <div class="glass-card p-5">
            <h4 class="fw-bold mb-4"><i class="bi bi-pencil-square me-2" style="color: #a855f7;"></i>Editar Producto</h4>

            <form action="{{ url_for('editar_producto', id=producto.id) }}" method="POST">
                <div class="mb-3">
                    <label class="form-label text-white-50 fs-7">Nombre del Producto</label>
                    <input type="text" class="form-control glass-input" name="nombre" value="{{ producto.nombre }}" required autocomplete="off">
                </div>
                <div class="mb-3">
                    <label class="form-label text-white-50 fs-7">Descripción</label>
                    <input type="text" class="form-control glass-input" name="descripcion" value="{{ producto.descripcion }}" autocomplete="off">
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label text-white-50 fs-7">Precio Costo (L.)</label>
                        <input type="number" step="0.01" class="form-control glass-input" name="precio_costo" value="{{ producto.precio_costo }}" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label text-white-50 fs-7">Precio Venta (L.)</label>
                        <input type="number" step="0.01" class="form-control glass-input" name="precio_venta" value="{{ producto.precio_venta }}" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-white-50 fs-7">Stock Disponible</label>
                    <input type="number" class="form-control glass-input" name="stock" value="{{ producto.stock }}" required>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-gradient">Guardar Cambios</button>
                    <a href="{{ url_for('inventario') }}" class="btn btn-outline-light rounded-3 px-4">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
