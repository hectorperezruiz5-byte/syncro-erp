<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sincro</title>
    
    <!-- Bootstrap 5 CSS y Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #062b1e 0%, #0a3d2b 50%, #031710 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card-login {
            background-color: #083827;
            border: 1px solid #00e676;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 420px;
        }

        .logo-login {
            width: 65px;
            height: 65px;
            object-fit: contain;
            border-radius: 50%;
        }

        .btn-login {
            background-color: #00e676;
            border-color: #00e676;
            color: #000000;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .btn-login:hover {
            background-color: #00c853;
            border-color: #00c853;
            color: #000000;
            transform: translateY(-2px);
        }

        .link-registro {
            color: #00e676;
            text-decoration: none;
            font-weight: 600;
        }

        .link-registro:hover {
            color: #b9f6ca;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center p-3">
        <div class="card card-login p-4">
            
            <!-- ENCABEZADO CON EL LOGO OFICIAL DE SINCRO -->
            <div class="text-center mb-4">
                <img src="/static/img/logo_syncro.png" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/3652/3652191.png'" class="logo-login mb-2" alt="Logo Sincro">
                <h3 class="fw-bold mb-1">Sincro <small class="text-warning fs-6">BC</small></h3>
                <p class="text-white-50 small mb-0">Sistema ERP para Microempresas Estudiantiles</p>
            </div>

            <!-- NOTIFICACIONES DE ERROR / ÉXITO -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} p-2 small text-center fw-bold mb-3 shadow-sm">
                            <i class="bi bi-info-circle-fill me-1"></i> {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- FORMULARIO DE INICIO DE SESIÓN -->
            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Correo Electrónico / Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark text-white border-secondary"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="usuario" class="form-control bg-dark text-white border-secondary" placeholder="hector@syncro.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark text-white border-secondary"><i class="bi bi-lock"></i></span>
                        <input type="password" name="clave" class="form-control bg-dark text-white border-secondary" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-login btn-lg w-100 mb-3 shadow">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
                </button>
            </form>

            <!-- ENLACE PARA REGISTRAR NUEVA MICROEMPRESA -->
            <div class="text-center border-top border-secondary pt-3 mt-2">
                <span class="text-white-50 small">¿No tienes una cuenta aún?</span><br>
                <a href="{{ url_for('registro') }}" class="link-registro small">
                    <i class="bi bi-plus-circle me-1"></i> Registrar Nueva Microempresa
                </a>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
