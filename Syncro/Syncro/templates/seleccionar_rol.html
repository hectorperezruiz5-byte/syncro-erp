<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncro - Bienvenido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body.tema-purpura { background: linear-gradient(135deg, #090d16 0%, #151934 50%, #2b1035 100%) !important; min-height: 100vh; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body.tema-azul { background: linear-gradient(135deg, #050b14 0%, #0f172a 50%, #1e3a8a 100%) !important; min-height: 100vh; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body.tema-esmeralda { background: linear-gradient(135deg, #022c22 0%, #064e3b 50%, #022c22 100%) !important; min-height: 100vh; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body.tema-cyberpunk { background: linear-gradient(135deg, #18181b 0%, #27272a 50%, #7f1d1d 100%) !important; min-height: 100vh; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 600;
            color: white;
        }
    </style>
</head>
<body class="tema-{{ session.get('tema_activo', 'purpura') }} d-flex align-items-center justify-content-center min-vh-100 p-4">

    <div class="container" style="max-width: 500px;">
        <div class="glass-card p-5 text-center">
            <h1 class="fw-bold mb-2" style="color: #c084fc;">
                <i class="bi bi-layers-fill me-2"></i>Syncro
            </h1>
            <p class="text-white-50 mb-4 fs-6">Sistema ERP Multi-tienda para Microempresas</p>

            <div class="d-grid gap-3">
                <a href="{{ url_for('login_admin') }}" class="btn btn-gradient py-3 fs-5">
                    <i class="bi bi-shield-lock me-2"></i> Acceso Microempresa
                </a>
                <a href="{{ url_for('acceso_cliente') }}" class="btn btn-outline-light py-3 fs-5 rounded-3">
                    <i class="bi bi-shop me-2"></i> Entrar como Cliente
                </a>
            </div>

            <div class="mt-4 pt-3 border-top border-secondary border-opacity-25">
                <a href="{{ url_for('registro_empresa') }}" class="text-white-50 text-decoration-none fs-7">
                    ¿No tienes cuenta? <span class="text-info fw-bold">Registra tu microempresa</span>
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
