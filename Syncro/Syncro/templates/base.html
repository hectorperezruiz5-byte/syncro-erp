<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncro - {{ session.get('nombre_empresa', 'Panel') }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body.tema-purpura { background: linear-gradient(135deg, #090d16 0%, #151934 50%, #2b1035 100%) !important; min-height: 100vh; color: #fff; }
        body.tema-azul { background: linear-gradient(135deg, #050b14 0%, #0f172a 50%, #1e3a8a 100%) !important; min-height: 100vh; color: #fff; }
        body.tema-esmeralda { background: linear-gradient(135deg, #022c22 0%, #064e3b 50%, #022c22 100%) !important; min-height: 100vh; color: #fff; }
        body.tema-cyberpunk { background: linear-gradient(135deg, #18181b 0%, #27272a 50%, #7f1d1d 100%) !important; min-height: 100vh; color: #fff; }

        .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px; }
        .glass-input { background: rgba(15, 23, 42, 0.8) !important; border: 1px solid rgba(255, 255, 255, 0.2) !important; color: #ffffff !important; border-radius: 10px !important; }
        
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); border: none; font-weight: 600; color: white; }
        .btn-gradient:hover { opacity: 0.9; color: white; }

        .nav-link-custom { color: rgba(255, 255, 255, 0.75); transition: all 0.3s ease; border-radius: 10px; padding: 8px 16px; font-weight: 500; }
        .nav-link-custom:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }

        body.tema-purpura .active-tab { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%) !important; color: #fff !important; font-weight: 700; box-shadow: 0 0 20px rgba(168, 85, 247, 0.6); transform: translateY(-2px); }
        body.tema-azul .active-tab { background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%) !important; color: #fff !important; font-weight: 700; box-shadow: 0 0 20px rgba(56, 189, 248, 0.6); transform: translateY(-2px); }
        body.tema-esmeralda .active-tab { background: linear-gradient(135deg, #059669 0%, #10b981 50%, #34d399 100%) !important; color: #022c22 !important; font-weight: 800; box-shadow: 0 0 22px rgba(52, 211, 153, 0.7); transform: translateY(-2px); }
        body.tema-cyberpunk .active-tab { background: linear-gradient(135deg, #dc2626 0%, #f43f5e 100%) !important; color: #fff !important; font-weight: 700; box-shadow: 0 0 20px rgba(244, 63, 94, 0.6); transform: translateY(-2px); }
    </style>
</head>
<body class="tema-{{ session.get('tema_activo', 'purpura') }} p-3 p-md-4">

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg glass-card p-2 mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-white fs-4 d-flex align-items-center" href="{{ url_for('dashboard') }}">
                <i class="bi bi-cpu-fill text-info me-2 fs-3"></i> Syncro
                <span class="badge bg-secondary ms-2 fs-6 fw-normal bg-opacity-50">{{ session.get('nombre_empresa', 'Empresa') }}</span>
            </a>
            <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navSyncro">
                <i class="bi bi-list fs-2"></i>
            </button>
            <div class="collapse navbar-collapse" id="navSyncro">
                <ul class="navbar-nav ms-auto gap-1 my-2 my-lg-0 align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom {{ 'active-tab' if request.endpoint == 'dashboard' }}" href="{{ url_for('dashboard') }}">
                            <i class="bi bi-speedometer2 me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom {{ 'active-tab' if request.endpoint == 'inventario' }}" href="{{ url_for('inventario') }}">
                            <i class="bi bi-box-seam me-1"></i> Inventario
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom {{ 'active-tab' if request.endpoint == 'ventas' }}" href="{{ url_for('ventas') }}">
                            <i class="bi bi-cart-check me-1"></i> Ventas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom {{ 'active-tab' if request.endpoint == 'gastos' }}" href="{{ url_for('gastos') }}">
                            <i class="bi bi-wallet2 me-1"></i> Gastos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom {{ 'active-tab' if request.endpoint == 'creditos' }}" href="{{ url_for('creditos') }}">
                            <i class="bi bi-person-badge me-1"></i> Fiados
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom {{ 'active-tab' if request.endpoint == 'personalizar' }}" href="{{ url_for('personalizar') }}">
                            <i class="bi bi-palette me-1"></i> Personalizar
                        </a>
                    </li>
                    {% if session.get('clave_tienda') %}
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-outline-info btn-sm rounded-pill px-3" href="{{ url_for('tienda_publica', clave=session.get('clave_tienda')) }}" target="_blank">
                            <i class="bi bi-shop me-1"></i> Ver Mi Tienda
                        </a>
                    </li>
                    {% endif %}
                    <li class="nav-item ms-lg-1">
                        <a class="btn btn-outline-danger btn-sm rounded-pill px-3" href="{{ url_for('logout') }}">
                            <i class="bi bi-box-arrow-right"></i> Salir
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
