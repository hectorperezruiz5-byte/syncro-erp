<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncro - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #090d16 0%, #151934 50%, #2b1035 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
        }
        .glass-input {
            background: rgba(15, 23, 42, 0.9) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: #fff !important;
            border-radius: 10px !important;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            font-weight: 600;
            color: white;
            border-radius: 10px;
        }
        .btn-gradient:hover {
            opacity: 0.9;
            color: white;
        }
    </style>
</head>
<body class="p-3">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <!-- Alertas Flash -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show text-white bg-opacity-75 border-0 mb-3 small" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <div class="glass-card p-4 p-md-5 shadow-lg">
                    <div class="text-center mb-4">
                        <div class="rounded-circle bg-primary bg-opacity-25 d-inline-flex p-3 text-info mb-2 shadow">
                            <i class="bi bi-cpu-fill fs-1"></i>
                        </div>
                        <h3 class="fw-bold text-white m-0">Syncro ERP</h3>
                        <p class="text-white-50 small">Inicia sesión en tu cuenta</p>
                    </div>

                    <form action="{{ url_for('login') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label text-white-50 small">Correo / Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text glass-input border-end-0 text-white-50"><i class="bi bi-envelope"></i></span>
                                <input type="text" class="form-control glass-input border-start-0 text-white" name="usuario" placeholder="kielsa17@gmail.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-white-50 small">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text glass-input border-end-0 text-white-50"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control glass-input border-start-0 text-white" name="clave" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-gradient w-100 py-2 mb-3">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Entrar al Sistema
                        </button>
                    </form>
                </div>

                <div class="text-center mt-3 text-white-50 small">
                    Syncro SaaS &bull; Farmacia Kielsa Edition
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
